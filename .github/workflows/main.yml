name: CI/CD MLflow Insurance Model

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  train-and-dockerize:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: Membangun_model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run training (MLflow logging)
      - name: Train model with MLflow
        working-directory: Membangun_model
        run: |
          python modelling.py

      # 5. Get latest MLflow run_id
      - name: Get latest MLflow run_id
        working-directory: Membangun_model
        run: |
          RUN_ID=$(ls -td mlruns/*/*/ | head -n 1 | awk -F'/' '{print $(NF-1)}')
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      # 6. Build Docker image from MLflow model
      - name: Build Docker Model
        working-directory: Membangun_model
        run: |
          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name cc

      # 7. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 8. Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag cc ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest

      # 9. Push Docker image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest
